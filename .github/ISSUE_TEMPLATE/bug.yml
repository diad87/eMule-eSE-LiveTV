name: Bug report
description: Something doesn't work. Crash, wrong behavior, broken feature, etc.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in as much as you can — even partial info helps.

  - type: input
    id: version
    attributes:
      label: eMule version
      description: Copy the version shown in the eMule window.
      placeholder: "eSE 9.0.0-beta.1"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true

  - type: input
    id: enabled-features
    attributes:
      label: Experimental features enabled
      description: List NetLab, privacy mode, relay or other non-default settings, or write "none".
      placeholder: "NetLab; Adaptive privacy mode"
    validations:
      required: true

  - type: textarea
    id: what-happens
    attributes:
      label: What happens?
      description: What did you do and what went wrong?
      placeholder: "I clicked X, expected Y, got Z instead."
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open eMule
        2. Click ...
        3. ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: If you see error messages in the console window, paste them here.
      render: text
    validations:
      required: false
