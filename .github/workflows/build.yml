# Required Windows build for emule.exe and ese-server.exe. Hardware and
# physical-network release checks still run on a maintained Windows builder,
# but compile, standalone tests and package self-test are merge gates.

name: build

on:
  push:
    branches: [ main, "release-*", "codex/v93-ci-validation" ]
    paths:
      - '.github/workflows/build.yml'
      - 'srchybrid/**'
      - 'tools/**'
      - 'tests/**'
      - 'libkad6/**'
      - 'libnatmap/**'
      - 'libreach/**'
      - 'librelaycore/**'
      - 'librelayclient/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'srchybrid/**'
      - 'tools/**'
      - 'tests/**'
      - 'libkad6/**'
      - 'libnatmap/**'
      - 'libreach/**'
      - 'librelaycore/**'
      - 'librelayclient/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # libutp is a real submodule (160000 mode); cryptopp/mbedtls/etc.
          # are vendored as regular trees. Recursive clones libutp.
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ── 1) eSE Node server ────────────────────────────────────────────
      - name: Install npm deps (eSE)
        working-directory: srchybrid/eSE
        run: npm ci --no-audit --no-fund

      - name: Test eSE Node server
        working-directory: srchybrid/eSE
        run: npm test

      - name: Reject synchronous production child processes
        run: python tools/check_node_sync_processes.py

      - name: Audit eSE Node dependencies
        working-directory: srchybrid/eSE
        run: npm audit --audit-level=moderate

      - name: Build ese-server.exe (pkg)
        working-directory: srchybrid/eSE
        run: npm run build

      - name: Verify ese-server.exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "srchybrid/eSE/ese-server.exe")) {
            Write-Error "ese-server.exe missing after pkg build"
            exit 1
          }
          $size = (Get-Item "srchybrid/eSE/ese-server.exe").Length / 1MB
          Write-Host "ese-server.exe = $([math]::Round($size,1)) MB"

      - name: "Smoke: ese-server.exe self-test"
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "srchybrid/eSE/ese-server.exe" `
                             -ArgumentList "--selftest" `
                             -PassThru -NoNewWindow
          if (-not $p.WaitForExit(15000)) {
            Stop-Process -Id $p.Id -Force
            throw "ese-server.exe self-test timed out after 15 seconds"
          }
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) {
            throw "ese-server.exe self-test failed with exit code $($p.ExitCode)"
          }

      # ── 3) emule.exe MFC build ────────────────────────────────────────
      # Node packaging is an explicit CI step. The native project does not
      # mutate or rebuild dashboard sources as a hidden pre-build side effect.
      - name: Build libutp dependency (Release|x64)
        run: |
          msbuild libutp/libutp.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OutDir=..\srchybrid\x64\Release\ /p:IntDir=..\srchybrid\x64\Release\libutp-obj\ /m /verbosity:minimal /nologo
        shell: pwsh

      - name: Build emule.sln (Release|x64)
        run: |
          $nativeLog = Join-Path $env:RUNNER_TEMP "emule-native-build.log"
          msbuild srchybrid/emule.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal /nologo /fl /flp:"logfile=$nativeLog;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_native_warning_baseline.py $nativeLog
        shell: pwsh

      - name: Verify emule.exe was produced
        shell: pwsh
        run: |
          $exe = "srchybrid/x64/Release/emule.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "emule.exe missing after MSBuild"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "emule.exe = $([math]::Round($size,1)) MB"

      # ── 2) Standalone native policies/codecs ──────────────────────────
      - name: Run standalone native tests
        shell: cmd
        run: srchybrid\tests\make.bat

      # ── 4) Self-test is a real gate ───────────────────────────────────
      - name: "Smoke: emule.exe self-test"
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "srchybrid/x64/Release/emule.exe" `
                             -ArgumentList "--headless","--selftest","--timeout=10" `
                             -PassThru -NoNewWindow
          if (-not $p.WaitForExit(20000)) {
            Stop-Process -Id $p.Id -Force
            throw "emule.exe self-test timed out after 20 seconds"
          }
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) {
            throw "emule.exe self-test failed with exit code $($p.ExitCode)"
          }
          Write-Host "emule.exe self-test: PASS"

      # ── 5) Bundle the build artefacts ─────────────────────────────────
      - name: Stage artifacts
        shell: pwsh
        run: |
          $dst = "build_output"
          New-Item -ItemType Directory $dst -Force | Out-Null
          Copy-Item "srchybrid/x64/Release/emule.exe" $dst
          Copy-Item "srchybrid/eSE/ese-server.exe"    $dst
          Copy-Item "README.md"                       $dst
          Copy-Item "license.txt"                     $dst
          Copy-Item "THIRD_PARTY_LICENSES.md"         $dst
          Copy-Item "docs/USER_GUIDE.md"              $dst
          # Build stamp
          "build: $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC`ncommit: $env:GITHUB_SHA`nrunner: $env:RUNNER_OS" |
            Out-File "$dst/BUILD_INFO.txt" -Encoding ASCII
          Get-ChildItem $dst | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: emule-ese-${{ github.sha }}
          path: build_output/
          retention-days: 14
          if-no-files-found: error
