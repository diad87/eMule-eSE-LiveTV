# Automatic JavaScript and native C++ security analysis for pushes, pull
# requests and the weekly scheduled scan.

name: CodeQL

on:
  push:
    branches: [ main, "release-*" ]
  pull_request:
    branches: [ main ]
  schedule:
    # Re-scan every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'

jobs:
  javascript:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  cpp:
    name: Analyze C++ (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install eSE dependencies
        working-directory: srchybrid/eSE
        run: npm ci --no-audit --no-fund

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build native solution
        shell: pwsh
        run: |
          msbuild libutp/libutp.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OutDir=..\srchybrid\x64\Release\ /p:IntDir=..\srchybrid\x64\Release\libutp-obj\ /m /verbosity:minimal /nologo
          msbuild srchybrid/emule.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal /nologo

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
