# Standalone unit test for the node-identity storage abstraction
# (INodeIdentityStorage + CreateNodeIdentityStorage factory).
#
# This self-contained target is independent of the vendored native build chain.
# Linux validates the POSIX backend and 0600 persistence; Windows validates the
# DPAPI backend and factory dispatch.

name: storage-test

on:
  push:
    paths:
      - 'srchybrid/INodeIdentityStorage.h'
      - 'srchybrid/NodeIdentityStorage.cpp'
      - 'tests/test_node_identity_storage.cpp'
      - '.github/workflows/storage-test.yml'
  pull_request:
    paths:
      - 'srchybrid/INodeIdentityStorage.h'
      - 'srchybrid/NodeIdentityStorage.cpp'
      - 'tests/test_node_identity_storage.cpp'
      - '.github/workflows/storage-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix:
    name: POSIX backend (ubuntu, g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Compile + run (exercises PosixFileStorage + factory + 0600)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
            srchybrid/NodeIdentityStorage.cpp \
            tests/test_node_identity_storage.cpp \
            -o storage_test
          ./storage_test

  windows:
    name: DPAPI backend (windows, cl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile + run (exercises WinDpapiStorage + factory)
        shell: cmd
        run: |
          cl /EHsc /O2 /W4 /std:c++17 ^
            srchybrid\NodeIdentityStorage.cpp ^
            tests\test_node_identity_storage.cpp ^
            Crypt32.lib /Fe:storage_test.exe
          storage_test.exe
