[eMule]
Port=4662
UDPPort=4672
WebServerPort=4711
WebServerPassword=emule
WebServerEnabled=1
Language=3082
; v8.0.25 — -1 = UNLIMITED (eMule's native sentinel for "no limit").
; NOT 0: the loader reads MaxDownload verbatim, so 0 means literal 0
; KB/s = dead download. Missing keys => eMule defaults to 80/90 KB/s.
MaxUpload=-1
MaxDownload=-1
