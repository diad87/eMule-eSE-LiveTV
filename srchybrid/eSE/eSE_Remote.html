<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>eSE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0d0d12;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
.box{max-width:420px;width:100%}.logo{font-size:36px;font-weight:800;background:linear-gradient(135deg,#ff6b35,#ff2d78,#c840e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px}
.spin{display:inline-block;width:48px;height:48px;border:3px solid #222;border-top-color:#ff6b35;border-radius:50%;animation:s .8s linear infinite;margin-bottom:16px}@keyframes s{to{transform:rotate(360deg)}}
#status{font-size:17px;margin-bottom:10px;font-weight:500}#detail{color:#666;font-size:13px;line-height:1.6;margin-bottom:16px;min-height:40px}
.step{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin:4px 0;font-size:13px;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.step .icon{font-size:18px;min-width:24px;text-align:center}.step .label{flex:1;color:#aaa}.step.ok{border-color:rgba(46,204,113,.3);background:rgba(46,204,113,.06)}.step.ok .label{color:#2ecc71}
.step.fail{border-color:rgba(231,76,60,.2);background:rgba(231,76,60,.04)}.step.fail .label{color:#888}
.step.try{border-color:rgba(255,107,53,.3);background:rgba(255,107,53,.06)}.step.try .label{color:#ff6b35}
.retry{margin-top:20px;background:linear-gradient(135deg,#ff6b35,#ff2d78);border:none;color:#fff;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;display:none;transition:all .2s}
.retry:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,53,.3)}
.last-seen{color:#555;font-size:11px;margin-top:12px}</style></head>
<body><div class="box"><div class="logo">eSE</div>
<div class="spin" id="spinner"></div>
<div id="status">Conectando...</div>
<div id="detail"></div>
<div id="steps"></div>
<div class="last-seen" id="last-seen"></div>
<button class="retry" id="retry" onclick="go()">🔄 Reintentar</button>
</div>
<script>
var NTFY_TOPIC = 'ese-cd27cf70dbd7e602';

function setStep(id, state, text) {
  var el = document.getElementById('step-' + id);
  if (!el) {
    el = document.createElement('div');
    el.id = 'step-' + id;
    el.className = 'step';
    el.innerHTML = '<span class="icon"></span><span class="label"></span>';
    document.getElementById('steps').appendChild(el);
  }
  el.className = 'step ' + state;
  el.querySelector('.icon').textContent = state === 'ok' ? '✅' : state === 'fail' ? '❌' : state === 'try' ? '⏳' : '•';
  el.querySelector('.label').textContent = text;
}

function tryConnect(url, timeout) {
  return new Promise(function(resolve) {
    var ctrl = new AbortController();
    var timer = setTimeout(function() { ctrl.abort(); resolve(false); }, timeout || 5000);
    fetch(url + '/api/status', { signal: ctrl.signal, mode: 'cors' })
      .then(function(r) { clearTimeout(timer); resolve(r.ok); })
      .catch(function() { clearTimeout(timer); resolve(false); });
  });
}

function go() {
  document.getElementById('status').textContent = 'Buscando tu servidor...';
  document.getElementById('spinner').style.display = 'inline-block';
  document.getElementById('retry').style.display = 'none';
  document.getElementById('steps').innerHTML = '';
  document.getElementById('detail').textContent = '';

  // Step 1: Fetch URLs from ntfy
  setStep('ntfy', 'try', 'Consultando ntfy.sh...');
  
  fetch('https://ntfy.sh/' + NTFY_TOPIC + '/json?poll=1&since=30m')
    .then(function(r) { return r.text(); })
    .then(function(t) {
      var lines = t.trim().split('\n').filter(function(l) { return l.startsWith('{'); });
      if (!lines.length) {
        setStep('ntfy', 'fail', 'Sin mensajes recientes (servidor apagado?)');
        document.getElementById('status').textContent = 'Servidor offline';
        document.getElementById('detail').textContent = 'No se han recibido señales en los últimos 30 minutos.';
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('retry').style.display = 'inline-block';
        return;
      }
      
      setStep('ntfy', 'ok', 'Señal recibida (' + lines.length + ' mensajes)');
      var last = JSON.parse(lines[lines.length - 1]);
      var age = Math.round((Date.now()/1000 - last.time) / 60);
      document.getElementById('last-seen').textContent = 'Última señal: hace ' + age + ' min';
      
      // Parse URLs (new format: JSON with tunnel + p2p)
      var urls = {};
      try { urls = JSON.parse(last.message); } catch(e) { urls = { tunnel: last.message }; }
      
      var attempts = [];
      if (urls.p2p) attempts.push({ url: urls.p2p, label: 'Conexión directa (P2P)', id: 'p2p' });
      if (urls.tunnel) attempts.push({ url: urls.tunnel, label: 'Túnel Cloudflare', id: 'tunnel' });
      
      if (!attempts.length) {
        setStep('urls', 'fail', 'No hay URLs disponibles');
        document.getElementById('status').textContent = 'Sin conexión';
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('retry').style.display = 'inline-block';
        return;
      }
      
      // Step 2: Try each URL
      document.getElementById('status').textContent = 'Probando conexiones...';
      var tryNext = function(idx) {
        if (idx >= attempts.length) {
          document.getElementById('status').textContent = 'No se pudo conectar';
          document.getElementById('detail').textContent = 'El servidor está encendido pero no accesible desde esta red.';
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('retry').style.display = 'inline-block';
          return;
        }
        var a = attempts[idx];
        setStep(a.id, 'try', a.label + '...');
        tryConnect(a.url, 6000).then(function(ok) {
          if (ok) {
            setStep(a.id, 'ok', a.label + ' ✓');
            document.getElementById('status').textContent = '¡Conectado!';
            document.getElementById('detail').textContent = 'Redirigiendo a eSE...';
            setTimeout(function() { window.location.href = a.url; }, 800);
          } else {
            setStep(a.id, 'fail', a.label + ' — sin respuesta');
            tryNext(idx + 1);
          }
        });
      };
      tryNext(0);
    })
    .catch(function() {
      setStep('ntfy', 'fail', 'Error conectando con ntfy.sh');
      document.getElementById('status').textContent = 'Error de red';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('retry').style.display = 'inline-block';
    });
}
go();
</script></body></html>
